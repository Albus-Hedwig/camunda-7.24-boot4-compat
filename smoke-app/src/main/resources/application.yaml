server:
  port: 8080

spring:
  datasource:
    url: jdbc:h2:mem:camunda;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
    driver-class-name: org.h2.Driver
    username: sa
    password: ""

camunda:
  bpm:
    admin-user:
      id: demo
      password: demo
    auto-deployment-enabled: true
    history-level: full
    database:
      schema-update: true

management:
  endpoints:
    web:
      exposure:
        include: health,info
