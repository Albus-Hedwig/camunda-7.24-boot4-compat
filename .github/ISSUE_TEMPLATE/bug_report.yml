name: Bug report
description: Report a reproducible compatibility problem
title: "[Bug]: "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Please search existing issues first. Do not include credentials, internal hostnames,
        customer data, or unsanitized logs.

  - type: input
    id: patch-version
    attributes:
      label: Patch-set version
      description: Release tag or commit from this repository
      placeholder: v0.1.0
    validations:
      required: true

  - type: input
    id: camunda-version
    attributes:
      label: Camunda version
      placeholder: 7.24.0
    validations:
      required: true

  - type: input
    id: spring-boot-version
    attributes:
      label: Spring Boot version
      placeholder: 4.1.2
    validations:
      required: true

  - type: input
    id: java-version
    attributes:
      label: Java version
      placeholder: 21.0.x
    validations:
      required: true

  - type: input
    id: database
    attributes:
      label: Database
      description: Type and version, e.g. PostgreSQL 17
    validations:
      required: true

  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      description: Minimal steps, ideally using smoke-app
      placeholder: |
        1. Apply patches...
        2. Run smoke-app...
        3. Call...
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
    validations:
      required: true

  - type: textarea
    id: actual
    attributes:
      label: Actual behavior
    validations:
      required: true

  - type: textarea
    id: logs
    attributes:
      label: Relevant logs or stack traces
      description: Sanitize before pasting
      render: shell

  - type: checkboxes
    id: checks
    attributes:
      label: Checklist
      options:
        - label: I searched existing issues
          required: true
        - label: I am using the latest patch release
          required: false
        - label: I removed credentials, internal hosts, and customer data
          required: true
        - label: This is not a Camunda Enterprise Edition issue
          required: true
